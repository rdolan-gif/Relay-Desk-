# Local development stack. `docker compose up -d postgres redis minio mailpit` for
# dependencies only (run api/web with pnpm), or `docker compose up --build` for everything.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay_desk
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay_desk']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: relay
      MINIO_ROOT_PASSWORD: relay-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['1025:1025', '8025:8025']

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay_desk
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:8080
      NODE_ENV: development
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['8080:80']
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
