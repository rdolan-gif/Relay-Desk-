name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_desk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay_desk
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay_desk_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=relay psql -h localhost -U relay -d relay_desk -c 'CREATE DATABASE relay_desk_test'
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint && pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Install Playwright browser
        run: pnpm --filter @relay-desk/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results
